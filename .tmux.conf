# ------------------------------------------------------------
# Base behavior
# ------------------------------------------------------------

# Faster escape handling. Helpful with Vim/Neovim.
set-option -sg escape-time 0
set-option -g focus-events on

# Bind additional prefix to Ctrl-Space.
set-option -g prefix2 C-Space
bind-key C-Space send-prefix -2

# Terminal settings.
set-option -g default-terminal "tmux-256color"

# RGB / truecolor.
set-option -sa terminal-overrides ',xterm-256color:RGB'
set-option -sa terminal-overrides ',tmux-256color:RGB'
set-option -sa terminal-overrides ',screen-256color:RGB'

# Start window index at 1 instead of 0.
set-option -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# Bigger scrollback.
set-option -g history-limit 50000

# Increase tmux message display duration from 750ms to 4s.
set-option -g display-time 4000

# Don't exit tmux server when closing the last session.
set-option -g exit-empty off

# Use vim key bindings in copy mode.
setw -g mode-keys vi

# Mouse controls.
set-option -g mouse on

# Disable the right-click menu.
unbind-key -n MouseDown3Pane

# Super useful when using grouped sessions and multi-monitor setup.
setw -g aggressive-resize on


# ------------------------------------------------------------
# Window / pane keybindings
# ------------------------------------------------------------

# Easier and faster switching between next/previous window.
bind-key C-p previous-window
bind-key C-n next-window

# Passthrough prefix ability.
bind-key C-Space send-prefix
bind-key C-b send-prefix

# Convenient jump to last window.
bind-key Space last-window
bind-key b last-window

# Open new panes and windows in current directory.
bind-key '"' split-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

# Extra splits using easier-to-remember keys.
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Reload ~/.tmux.conf.
bind-key r source-file "$HOME/.tmux.conf" \; display-message "tmux config reloaded"

# Pane movement.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Resize panes.
bind-key H resize-pane -L 5
bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key L resize-pane -R 5


# ------------------------------------------------------------
# Smart pane switching with Vim/Neovim awareness
# ------------------------------------------------------------

is_vim="ps -o state= -o comm= -t '#{pane_tty}' 2>/dev/null \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R


# ------------------------------------------------------------
# Clipboard
# ------------------------------------------------------------

# If your tmux version complains, change this to:
#   set-option -g set-clipboard on
set-option -g set-clipboard external
# Vi-style copy bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
set-option -g allow-passthrough on
set-option -g terminal-features 'xterm*:clipboard'

# Load tmux-yank first.
if-shell "[ -f '$HOME/.tmux/plugins/tmux-yank/yank.tmux' ]" \
  "run-shell '$HOME/.tmux/plugins/tmux-yank/yank.tmux'" \
  "display-message 'tmux-yank not found'"

# ------------------------------------------------------------
# Simple TokyoNight-ish fallback status line
# ------------------------------------------------------------

set-option -g status on
set-option -g status-interval 5
set-option -g status-position bottom

set-option -g status-style "fg=#c8d3f5,bg=#222436"
set-option -g message-style "fg=#c8d3f5,bg=#1e2030"
set-option -g mode-style "fg=#222436,bg=#82aaff"

set-option -g pane-border-style "fg=#1e2030"
set-option -g pane-active-border-style "fg=#82aaff"

set-option -g window-status-style "fg=#c8d3f5,bg=#222436"
set-option -g window-status-current-style "fg=#222436,bg=#82aaff,bold"

set-option -g window-status-format " #I:#W "
set-option -g window-status-current-format " #I:#W* "

set-option -g status-left-length 40
set-option -g status-left "#[fg=#222436,bg=#c3e88d,bold] #S #[fg=#c3e88d,bg=#222436]|"

set-option -g status-right-length 100
set-option -g status-right "#[fg=#86e1fc,bg=#222436] %Y-%m-%d #[fg=#ffc777,bg=#222436]%H:%M #[fg=#c099ff,bg=#222436]#h "


# ------------------------------------------------------------
# Optional TokyoNight tmux theme
#
# @ww_tokyonight_enabled defaults to 1, but can be toggled off
# temporarily inside the running tmux server.
# ------------------------------------------------------------

if -F "#{==:#{@ww_tokyonight_enabled},}" \
  "set-option -g @ww_tokyonight_enabled 1"

if-shell "[ '#{@ww_tokyonight_enabled}' = '1' ] && [ -f '$HOME/.tmux/plugins/tmux-tokyonight-nvim/tokyonight.tmux' ] && [ -f '$HOME/.tmux/plugins/tmux-tokyonight-nvim/tokyonight.nvim/extras/tmux/tokyonight_moon.tmux' ]" \
  "set-option -g @tokyonight 'moon' \; run-shell '$HOME/.tmux/plugins/tmux-tokyonight-nvim/tokyonight.tmux'"


# ------------------------------------------------------------
# Toggle TokyoNight theme temporarily
#
# Prefix + T disables/enables the plugin and reloads tmux config.
# This resets when the tmux server exits.
# ------------------------------------------------------------

bind-key T if -F "#{==:#{@ww_tokyonight_enabled},1}" \
  "set-option -g @ww_tokyonight_enabled 0 \; source-file '$HOME/.tmux.conf' \; display-message 'TokyoNight disabled temporarily'" \
  "set-option -g @ww_tokyonight_enabled 1 \; source-file '$HOME/.tmux.conf' \; display-message 'TokyoNight enabled temporarily'"
